name: aikya-production

# Single-host production reference. Use managed data services and an orchestrator
# when availability, scale, or regional requirements exceed this topology.
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    restart: always
    security_opt: [no-new-privileges:true]
    networks: [edge, app]

  frontend:
    image: "${AIKYA_FRONTEND_IMAGE:?Set AIKYA_FRONTEND_IMAGE to an approved immutable image reference}"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?Set NUXT_PUBLIC_SITE_URL}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp]
    restart: always
    security_opt: [no-new-privileges:true]
    networks: [app]

  backend:
    image: "${AIKYA_BACKEND_IMAGE:?Set AIKYA_BACKEND_IMAGE to an approved immutable image reference}"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    environment: &backend-environment
      AIKYA_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?Set CELERY_BROKER_URL}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?Set STORAGE_ENDPOINT}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:?Set STORAGE_PUBLIC_ENDPOINT}
      STORAGE_REGION: ${STORAGE_REGION:?Set STORAGE_REGION}
      STORAGE_BUCKET_QUARANTINE: ${STORAGE_BUCKET_QUARANTINE:?Set STORAGE_BUCKET_QUARANTINE}
      STORAGE_BUCKET_DOCUMENTS: ${STORAGE_BUCKET_DOCUMENTS:?Set STORAGE_BUCKET_DOCUMENTS}
      STORAGE_BUCKET_OUTPUTS: ${STORAGE_BUCKET_OUTPUTS:?Set STORAGE_BUCKET_OUTPUTS}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY through the deployment secret store}
      AUTH_COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      TRANSLATION_DEFAULT_PROVIDER: ${TRANSLATION_DEFAULT_PROVIDER:-libretranslate}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:?Set LIBRETRANSLATE_URL}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_SECONDS: "30"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    restart: always
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    networks: [app, data, egress]

  worker:
    image: "${AIKYA_BACKEND_IMAGE:?Set AIKYA_BACKEND_IMAGE to an approved immutable image reference}"
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs: [/tmp]
    restart: always
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    networks: [data, egress]

  migrate:
    image: "${AIKYA_BACKEND_IMAGE:?Set AIKYA_BACKEND_IMAGE to an approved immutable image reference}"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt: [no-new-privileges:true]
    networks: [data]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD through the deployment secret store}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always
    networks: [data]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: always
    networks: [data]

  clamav:
    image: clamav/clamav:1.4_base
    volumes:
      - clamav-data:/var/lib/clamav
    restart: always
    networks: [data, egress]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD through the deployment secret store}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: always
    networks: [data]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD through the deployment secret store}
      STORAGE_BUCKET_QUARANTINE: ${STORAGE_BUCKET_QUARANTINE:?Set STORAGE_BUCKET_QUARANTINE}
      STORAGE_BUCKET_DOCUMENTS: ${STORAGE_BUCKET_DOCUMENTS:?Set STORAGE_BUCKET_DOCUMENTS}
      STORAGE_BUCKET_OUTPUTS: ${STORAGE_BUCKET_OUTPUTS:?Set STORAGE_BUCKET_OUTPUTS}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${STORAGE_BUCKET_QUARANTINE}"
        mc mb --ignore-existing "local/$${STORAGE_BUCKET_DOCUMENTS}"
        mc mb --ignore-existing "local/$${STORAGE_BUCKET_OUTPUTS}"
        mc anonymous set none "local/$${STORAGE_BUCKET_QUARANTINE}"
        mc anonymous set none "local/$${STORAGE_BUCKET_DOCUMENTS}"
        mc anonymous set none "local/$${STORAGE_BUCKET_OUTPUTS}"
    restart: "no"
    networks: [data]

networks:
  edge:
  # Provider traffic and signature updates require outbound DNS/HTTPS.
  # Keep stateful data services off this network and publish no host ports.
  egress:
  app:
    internal: true
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
