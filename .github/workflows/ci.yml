name: Aikya CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Nuxt quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_PUBLIC_SITE_URL: https://example.invalid
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build Nuxt production output
        run: npm run build

  backend:
    name: FastAPI quality and Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy app
      - name: Compile Python sources
        run: uv run python -m compileall -q app alembic
      - name: Validate migration graph
        run: uv run alembic heads
      - name: Prevent persisted UUIDv4 regressions
        shell: bash
        run: |
          if grep -R --line-number --include='models.py' 'uuid4' app/modules; then
            echo 'Persisted SQLAlchemy identifiers must use app.platform.identifiers.new_uuid7.'
            exit 1
          fi

  containers:
    name: Container and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend, backend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate development Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          target: production
          load: true
          tags: aikya-frontend:ci
          build-args: NUXT_PUBLIC_SITE_URL=https://example.invalid
          cache-from: type=gha,scope=aikya-frontend
          cache-to: type=gha,mode=max,scope=aikya-frontend
      - name: Build production backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          target: production
          load: true
          tags: aikya-backend:ci
          cache-from: type=gha,scope=aikya-backend
          cache-to: type=gha,mode=max,scope=aikya-backend
